# Publish to PyPI with Trusted Publishing (OIDC). No API token is stored anywhere.
#
# One-time setup, which only the account owner can do, on https://pypi.org:
#   Your projects -> Publishing -> Add a new pending publisher
#     Owner: manunicholasjacob
#     Repository: powerstamp
#     Workflow name: publish.yml
#     Environment name: pypi
# Then create a repository environment named "pypi" under Settings -> Environments.
#
# After that, pushing a tag that starts with v publishes that tag. Nothing else does.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Confirm the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')"
          echo "tag=$tag packaged=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "The tag and the packaged version disagree. Refusing to publish." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/powerstamp/
    permissions:
      id-token: write   # the OIDC token Trusted Publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The moving tag that PyPA itself documents for this action.
      - uses: pypa/gh-action-pypi-publish@release/v1
